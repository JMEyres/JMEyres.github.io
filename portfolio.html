<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Backlog | Josh Eyres</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/portfolio.css" />
  <link rel="icon" type="image/png" href="Images/favicon-32x32.png">
</head>
<body style="overflow: hidden">
  <header class="simple-header">
    <div class="logo">
      <a href="index.html">
        <img src="Images/Logo.jpg" alt="Josh Eyres Logo">
      </a>
    </div>
    <nav class="hero-links">
      <a href="./portfolio.html">Portfolio</a>
      <a href="./about.html">About</a>
      <a href="./hobbies.html">Hobbies</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <!-- Page content -->
<main class="explorer-layout">
  <aside class="project-directory">
    <div class="directory-header">C:\PROJECTS\A-Z</div>
    <div class="search-box">
      <input type="text" id="project-search" placeholder="Search directory..." autocomplete="off">
    </div>
    <ul id="project-list" class="file-list">
    </ul>
  </aside>

  <section class="project-view">
    <div class="retro-window" id="window-container">
      <div class="titlebar">
        <span class="title-text" id="proj-title">System Idle...</span>
      </div>

      <div class="window-content" id="window-content-main">   
        <img src="" id="proj-icon" class="win-icon" alt="">
          <h1 id="proj-header">Select a File</h1>
          <p id="proj-desc">Initialize a project from the directory to view data.</p>
          <img src="" id="proj-img">
          
          <h1 id="gallery-header">Gallery:</h1>
          <div id="gallery-area" class="gallery-container"></div> 
          
          <div id="tag-list" class="tag-container"></div>
      </div>
    </div>
  </section>
</main>

  <footer class="compact-portfolio-footer">
      <!-- Clean left-to-right link cluster -->
      <div class="footer-links-group">
          <a href="https://www.linkedin.com/in/josh-eyres-26aaa11b7/" class="custom-footer-link">> LINKEDIN</a>
          <a href="https://github.com/JMEyres" class="custom-footer-link">> GITHUB</a>
          <a href="mailto:jmeyres.business@gmail.com" class="custom-footer-link">> EMAIL</a>
      </div>
      
      <!-- Tiny copyright pushed to the far side or nestled right next to them -->
      <span class="tiny-copyright">
          &copy; 2026 Josh Eyres. All rights reserved.
      </span>
  </footer>
</body>
</html>

<script src="projects.js"></script>

<script>
const listContainer = document.getElementById('project-list');
const searchInput = document.getElementById('project-search');
const projectList = document.getElementById('project-list');
const projectDir = document.querySelector('.project-directory');

document.getElementById('gallery-header').classList.add('hidden');

// --- 1. HELPER: CONTEXTUAL PLACEHOLDER ---
function updatePlaceholderState() {
    if (projectList.classList.contains('collapsed')) {
        searchInput.placeholder = "Search directory... (Click header to expand)";
    } else {
        searchInput.placeholder = "Search directory...";
    }
}

// --- 2. SEARCH INPUT LOGIC ---
searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const items = listContainer.getElementsByTagName('li');

    Array.from(items).forEach(item => {
        const title = item.textContent.toLowerCase();
        item.style.display = title.includes(term) ? 'block' : 'none';
    });
});

// Focusing the search bar on mobile expands the list back out
searchInput.addEventListener('focus', () => {
    projectList.classList.remove('collapsed');
    updatePlaceholderState();
});

// --- 3. UI RENDERER FUNCTION ---
function loadProject(id) {
    const data = projects[id];
    if (!data) return;

    const mainImg = document.getElementById('proj-img');
    const galleryArea = document.getElementById('gallery-area');
    const galleryHeader = document.getElementById('gallery-header');

    // Handle Main Data
    document.getElementById('proj-title').innerText = data.title;
    document.getElementById('proj-header').innerText = data.title;
    document.getElementById('proj-desc').innerText = data.description;
    document.getElementById('proj-icon').src = data.icon || '';

    // Handle Main Image
    if (data.imgPath) {
        mainImg.src = data.imgPath;
        mainImg.style.display = "block";
        mainImg.style.opacity = "0"; 
        
        mainImg.onload = function() {
            mainImg.style.opacity = "1";
        };

        document.getElementById('window-container').style.setProperty('--window-bg', `url('${data.imgPath}')`);
    } else {
        mainImg.style.display = "none";
        document.getElementById('window-container').style.setProperty('--window-bg', 'none');
    }

    // Handle Gallery Images
    galleryArea.innerHTML = ''; 

    if (data.gallery && data.gallery.length > 0) {
        galleryHeader.classList.remove('hidden');
        data.gallery.forEach(src => {
            const figure = document.createElement('figure');
            figure.className = "gallery-item";

            const extraImg = document.createElement('img');
            extraImg.src = src;
            extraImg.className = "gallery-thumb";
            extraImg.onclick = () => window.open(src, '_blank');

            const caption = document.createElement('figcaption');
            const fileName = src.split('/').pop().split('.')[0]; 
            caption.innerText = fileName.replace(/-/g, ' ').toUpperCase(); 
            caption.className = "gallery-caption";

            figure.appendChild(extraImg);
            figure.appendChild(caption);
            galleryArea.appendChild(figure);
        });
    } else {
        galleryHeader.classList.add('hidden');
    }

    // Update URL query string without reloading page
    window.history.pushState(null, '', `?id=${id}`);
}

// --- 4. BUILD SIDEBAR DIRECTORY ---
Object.keys(projects).forEach(key => {
    const listItem = document.createElement('li');
    const project = projects[key];
    
    const link = document.createElement('a');
    link.href = `?id=${key}`;
    link.className = "sidebar-link";
    link.innerText = project.dirTitle;

    link.addEventListener('click', (e) => {
        e.preventDefault(); 
        
        loadProject(key);
        
        // Automatically collapse the file list when a project is selected
        projectList.classList.add('collapsed');
        updatePlaceholderState();
    });

    listItem.appendChild(link);
    listContainer.appendChild(listItem);
});

// --- 5. DIRECTORY HEADER ACCORDION TOGGLE ---
const dirHeader = document.querySelector('.directory-header');
if (dirHeader) {
    dirHeader.style.cursor = 'pointer';
    dirHeader.addEventListener('click', () => {
        projectList.classList.toggle('collapsed');
        updatePlaceholderState();
    });
}

// --- 6. INITIAL PAGE LOAD ---
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const initialId = params.get('id');
    if (initialId && projects[initialId]) {
        loadProject(initialId);

        if (window.innerWidth < 768) {
            projectList.classList.add('collapsed');
        }
    }
    updatePlaceholderState();
};
</script>
