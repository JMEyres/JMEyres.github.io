<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Backlog | Josh Eyres</title>
  <link rel="stylesheet" href="CSS/base.css" />
  <link rel="stylesheet" href="CSS/portfolio.css" />
  <link rel="icon" type="image/png" href="Images/favicon-32x32.png">
</head>
<body style="overflow: hidden">
  <header class="simple-header">
    <div class="logo">
      <a href="index.html">
        <img src="Images/Logo.jpg" alt="Josh Eyres Logo">
      </a>
    </div>
    <nav class="hero-links">
      <a href="./portfolio.html">Portfolio</a>
      <a href="./about.html">About</a>
      <a href="./hobbies.html">Hobbies</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <!-- Page content -->
<main class="explorer-layout">
  <aside class="project-directory">
    <div class="directory-header">C:\PROJECTS\A-Z</div>
    <div class="search-box">
      <input type="text" id="project-search" placeholder="Search directory..." autocomplete="off">
    </div>
    <ul id="project-list" class="file-list">
    </ul>
  </aside>

  <section class="project-view">
    <div class="retro-window" id="window-container">
      <div class="titlebar">
        <span class="title-text" id="proj-title">System Idle...</span>
      </div>

      <div class="window-content" id="window-content-main">   
        <img src="" id="proj-icon" class="win-icon" alt="">
          <h1 id="proj-header">Select a File</h1>
          <p id="proj-desc">Initialize a project from the directory to view data.</p>
          <img src="" id="proj-img">
          
          <h1 id="gallery-header">Gallery:</h1>
          <div id="gallery-area" class="gallery-container"></div> 
          
          <div id="tag-list" class="tag-container"></div>
      </div>
    </div>
  </section>
</main>

  <footer class="compact-portfolio-footer">
      <!-- Clean left-to-right link cluster -->
      <div class="footer-links-group">
          <a href="https://www.linkedin.com/in/josh-eyres-26aaa11b7/" class="custom-footer-link">> LINKEDIN</a>
          <a href="https://github.com/JMEyres" class="custom-footer-link">> GITHUB</a>
          <a href="mailto:jmeyres.business@gmail.com" class="custom-footer-link">> EMAIL</a>
      </div>
      
      <!-- Tiny copyright pushed to the far side or nestled right next to them -->
      <span class="tiny-copyright">
          &copy; 2026 Josh Eyres. All rights reserved.
      </span>
  </footer>

  <!-- Modal Window for Creating/Editing Projects -->
<div id="admin-modal" class="admin-modal">
  <div class="admin-modal-body">
    <h2 id="modal-heading" style="margin-top:0; color:#00ff66;">> PROJECT CONFIG</h2>
    <form id="admin-form">
      <input type="hidden" id="edit-project-key" />

      <div class="admin-form-group">
        <label>UNIQUE IDENTIFIER (e.g. "lonely-bookshop")</label>
        <input type="text" id="form-key" class="admin-input" required />
      </div>

      <div class="admin-form-group">
        <label>DIRECTORY TITLE (e.g. "BOOKSHOP.EXE")</label>
        <input type="text" id="form-dirtitle" class="admin-input" required />
      </div>

      <div class="admin-form-group">
        <label>FULL PROJECT TITLE</label>
        <input type="text" id="form-title" class="admin-input" required />
      </div>

      <div class="admin-form-group">
        <label>DESCRIPTION</label>
        <textarea id="form-desc" class="admin-textarea" required></textarea>
      </div>

      <div class="admin-form-group">
        <label>MAIN IMAGE FILE (Uploads to Images/)</label>
        <input type="file" id="form-main-img" class="admin-input" accept="image/*" />
        <small id="current-main-img-label" style="color:#666; margin-top:2px;"></small>
      </div>

      <div class="admin-form-group">
        <label>GALLERY IMAGES (Uploads multiple to Images/)</label>
        <input type="file" id="form-gallery-imgs" class="admin-input" accept="image/*" multiple />
        <small id="current-gallery-label" style="color:#666; margin-top:2px;"></small>
      </div>

      <div class="admin-actions">
        <button type="button" class="admin-btn" id="modal-cancel-btn">CANCEL</button>
        <button type="submit" class="admin-btn" id="modal-save-btn">COMMIT TO REPO</button>
      </div>
    </form>
  </div>
</div>
<script src="JS/projectScript.js"></script> 

</body>
</html>
